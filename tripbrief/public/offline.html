<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Trip Brief</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#070b16; color:#eaf0ff;
         font:16px/1.6 ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; text-align:center; padding:24px; }
  .box { max-width:420px; }
  .mark { width:64px; height:64px; border-radius:18px; margin:0 auto 20px; display:grid; place-items:center;
          font-size:32px; background:linear-gradient(135deg,#4FD6B3,#7C9CFF); color:#04101f; }
  h1 { font-size:22px; margin:0 0 10px; letter-spacing:-.4px; }
  p { color:#8e9bc4; font-size:14.5px; margin:0 0 22px; }
  button { background:linear-gradient(135deg,#4FD6B3,#7C9CFF); color:#04101f; border:0; font-weight:700;
           padding:12px 22px; border-radius:12px; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">✈</div>
    <h1>You're offline</h1>
    <p>Trip Brief needs a connection to fetch live weather, exchange rates and holidays.
       Destinations you've already viewed this session are still cached.</p>
    <button onclick="location.href='/'">Try again</button>
  </div>
</body>
</html>
